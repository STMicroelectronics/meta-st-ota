## This is an example RAUC system configuration for STM32MPU.
## This file will be installed into /etc/rauc/system.conf
## on your target and describes your system from the
## perspective of the RAUC update service.
## ---
##

[system]
compatible=stm32mpu
bootloader=custom
mountprefix=/usr/local/rauc
max-bundle-download-size=805306368

[keyring]
path=/usr/lib/rauc/ca.cert.pem

[handlers]
bootloader-custom-backend=/usr/lib/rauc/st-rauc-fwu.sh

[slot.rootfs.0]
device=/dev/disk/by-partlabel/rootfs-a
type=ext4
bootname=A

[slot.rootfs.1]
device=/dev/disk/by-partlabel/rootfs-b
type=ext4
bootname=B

[slot.fip.0]
device=/dev/disk/by-partlabel/fip-a
type=raw
parent=rootfs.0

[slot.fip.1]
device=/dev/disk/by-partlabel/fip-b
type=raw
parent=rootfs.1

[slot.bootfs.0]
device=/dev/disk/by-partlabel/bootfs-a
type=ext4
parent=rootfs.0

[slot.bootfs.1]
device=/dev/disk/by-partlabel/bootfs-b
type=ext4
parent=rootfs.1

[slot.vendorfs.0]
device=/dev/disk/by-partlabel/vendorfs-a
type=ext4
parent=rootfs.0

[slot.vendorfs.1]
device=/dev/disk/by-partlabel/vendorfs-b
type=ext4
parent=rootfs.1
